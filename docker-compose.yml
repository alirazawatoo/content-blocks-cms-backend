# Development stack: Postgres plus the CMS, seeded and ready to log into.
#
#   docker compose up --build
#
# Admin panel: http://localhost:8270/admin   (credentials below)
# GraphQL:     http://localhost:8270/graphql
# REST:        http://localhost:8270/api/home-page
#
# Secrets and the database password come from `.env` (copy `.env.example`); the
# stack refuses to start without them. The README explains how to generate them.

name: jomi-cms

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-jomi_cms}
      POSTGRES_USER: ${DATABASE_USERNAME:-jomi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      # Published only so you can inspect the database with psql; the CMS reaches it
      # over the compose network on 5432.
      - "8271:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-jomi} -d ${DATABASE_NAME:-jomi_cms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: http://localhost:8270

      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-jomi_cms}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-jomi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}

      APP_KEYS: ${APP_KEYS:?set APP_KEYS in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?set API_TOKEN_SALT in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-}

      # Seeds the Home Page the challenge asks for, the public read permissions the
      # front-end needs, and the first admin user when SEED_ADMIN_PASSWORD is set.
      # Idempotent: safe on every boot.
      SEED_ON_BOOTSTRAP: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@jomi.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FIRSTNAME: JOMI
      SEED_ADMIN_LASTNAME: Admin

      # The Next.js front-end runs on a different origin.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "8270:1337"
    volumes:
      # Media survives a container rebuild; without this every `up --build` empties
      # the media library while the database still references the files.
      - uploads:/opt/app/public/uploads

volumes:
  db-data:
  uploads:
